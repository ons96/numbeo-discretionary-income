name: Crawl

# Refreshes the data from numbeo.com and commits it; Publish then rebuilds the
# site. The daily refresh is two requests; the city-page drip below adds up to
# PAGE_BUDGET more (25 by default, about a minute), and the optional full list
# crawl adds 235 on top of that.
#
# numbeo refuses datacenter IPs (GitHub's hosted runners included) with
# "503 Access Forbidden", so lib/http.mjs falls back to fetching through
# r.jina.ai, a reader service that returns the same HTML from its own address.
# If you happen to have a runner with a residential IP, set the repository
# variable CRAWL_RUNNER to its label and the two requests go out directly.

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      page_budget:
        description: "Extra city pages for real living-cost figures (0 = skip)"
        default: "0"
      max_age_days:
        description: "Refetch a city page if older than this many days"
        default: "30"
      refresh_lists:
        description: "Also crawl the full country/city list (235 requests)"
        type: boolean
        default: false
      force:
        description: "Fetch even if the cached data is less than 20 hours old"
        type: boolean
        default: false

permissions:
  contents: write
  # needed to kick the Publish workflow: a commit made with GITHUB_TOKEN does
  # not trigger other workflows on its own
  actions: write

concurrency:
  group: crawl
  cancel-in-progress: false

env:
  CONCURRENCY: 1
  MIN_GAP_MS: 1200

jobs:
  crawl:
    runs-on: ${{ vars.CRAWL_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      # Optional. A free Jina key lifts the r.jina.ai reader from 20 to 100
      # requests a minute; without it the crawl still runs, just with more 429s.
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prices by city (salary + the four rents)
        run: |
          hours=20; [ "${{ inputs.force }}" = "true" ] && hours=0
          node scraper/crawl-bulk.mjs --max-age-hours=$hours

      - name: Index table
        run: |
          hours=20; [ "${{ inputs.force }}" = "true" ] && hours=0
          node scraper/crawl-indices.mjs --max-age-hours=$hours

      - name: Country and city list
        if: inputs.refresh_lists == 'true'
        run: node scraper/crawl-lists.mjs

      - name: Extra city pages
        # Slow drip: 25 new city pages per run fills the remaining cities in
        # about three weeks, and the ones already fetched are reused until
        # --max-age-days. Set repository variable PAGE_BUDGET=0 to pause.
        if: ${{ (inputs.page_budget || vars.PAGE_BUDGET || '25') != '0' }}
        run: node scraper/crawl-cities.mjs --budget=${{ inputs.page_budget || vars.PAGE_BUDGET || '25' }} --max-age-days=${{ inputs.max_age_days || 30 }}

      - name: Minimum wage by country
        run: node scraper/crawl-minwage.mjs

      - name: Quality of life and crime indices
        run: node scraper/crawl-safety.mjs

      - name: Backfill indices for unranked cities
        run: node scraper/backfill-indices.mjs

      - name: Merge
        run: |
          node scraper/merge.mjs
          node -e "
            const d = require('./data/cities.json');
            if (!d.withData) { console.log('::error::nothing scraped'); process.exit(1); }
          "

      - name: Check minimum-wage provenance
        # The wage API sometimes answers with an ILO aggregate - a regional or
        # sectoral average, or a "national floor" - instead of the statutory rate
        # a country actually sets. Switzerland has no federal minimum wage, so an
        # unchecked regional average lands a fabricated wage on Zurich. Fail the
        # run rather than publish it.
        run: node scraper/check-minwage.mjs

      - name: Stamp check time
        # Separate from the data timestamps: the data may be unchanged while the
        # check itself is current, and the site says so.
        run: node -e "const fs=require('fs');fs.writeFileSync('data/lastcheck.json',JSON.stringify({checkedAt:new Date().toISOString()}))"

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --quiet --cached; then
            echo "numbeo returned the same numbers, nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: crawl $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
