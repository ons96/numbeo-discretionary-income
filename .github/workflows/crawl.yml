name: Crawl

# Refreshes the data from numbeo.com and commits it; Publish then rebuilds the
# site. Two requests, about five seconds.
#
# numbeo refuses datacenter IPs (GitHub's hosted runners included) with
# "503 Access Forbidden", so lib/http.mjs falls back to fetching through
# r.jina.ai, a reader service that returns the same HTML from its own address.
# If you happen to have a runner with a residential IP, set the repository
# variable CRAWL_RUNNER to its label and the two requests go out directly.

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      page_budget:
        description: "Extra city pages for real living-cost figures (0 = skip)"
        default: "0"
      max_age_days:
        description: "Refetch a city page if older than this many days"
        default: "30"
      refresh_lists:
        description: "Also crawl the full country/city list (235 requests)"
        type: boolean
        default: false

permissions:
  contents: write
  # needed to kick the Publish workflow: a commit made with GITHUB_TOKEN does
  # not trigger other workflows on its own
  actions: write

concurrency:
  group: crawl
  cancel-in-progress: false

env:
  CONCURRENCY: 1
  MIN_GAP_MS: 1200

jobs:
  crawl:
    runs-on: ${{ vars.CRAWL_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prices by city (salary + the four rents)
        run: node scraper/crawl-bulk.mjs

      - name: Index table
        run: node scraper/crawl-indices.mjs

      - name: Country and city list
        if: inputs.refresh_lists == 'true'
        run: node scraper/crawl-lists.mjs

      - name: Extra city pages
        if: inputs.page_budget != '0'
        run: node scraper/crawl-cities.mjs --budget=${{ inputs.page_budget }} --max-age-days=${{ inputs.max_age_days || 30 }}

      - name: Merge
        run: |
          node scraper/merge.mjs
          node -e "
            const d = require('./data/cities.json');
            if (!d.withData) { console.log('::error::nothing scraped'); process.exit(1); }
          "

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "data: crawl $(date -u +%Y-%m-%d)"
          git push

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
