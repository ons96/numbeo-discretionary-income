name: Crawl

# Fetches city pages from numbeo.com and commits the data.
#
# IMPORTANT: numbeo.com refuses requests from datacenter IP ranges (GitHub's
# hosted runners included) with "Access Forbidden" 503. This workflow therefore
# only works on a runner with a residential IP - e.g. a self-hosted runner at
# home (set the repo variable CRAWL_RUNNER to its label).
#
# Manual only, on purpose: a scheduled run on a hosted runner would just fail.

on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Cities to fetch this run"
        default: "300"
      max_age_days:
        description: "Refetch a city if its data is older than this many days"
        default: "30"
      refresh_lists:
        description: "Re-crawl the country/city list first"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

env:
  CONCURRENCY: 1
  MIN_GAP_MS: 1500

jobs:
  crawl:
    runs-on: ${{ vars.CRAWL_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe
        run: node scraper/probe.mjs

      - name: Country and city list
        run: |
          if [ "${{ inputs.refresh_lists }}" = "true" ] || [ ! -f data/lists.json ] || [ -n "$(find data/lists.json -mtime +30 2>/dev/null)" ]; then
            node scraper/crawl-lists.mjs
          else
            echo "list is fresh, reusing it"
          fi

      - name: Fetch city pages
        run: |
          node scraper/crawl-cities.mjs \
            --budget=${{ inputs.budget || 300 }} \
            --max-age-days=${{ inputs.max_age_days || 30 }}

      - name: Merge and check
        run: |
          node scraper/merge.mjs
          node -e "
            const d = require('./data/cities.json');
            const withData = d.cities.filter(c => c.ok && c.hasData !== false).length;
            console.log(d.count + ' cities tracked, ' + withData + ' with data');
            if (!withData) { console.log('::error::nothing scraped - see the probe step above'); process.exit(1); }
          "

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "data: crawl $(date -u +%Y-%m-%d)"
          git push
