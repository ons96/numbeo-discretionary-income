name: Crawl

# Fetches numbeo.com and commits the data.
#
# numbeo refuses datacenter IP ranges (GitHub's hosted runners are Azure) with
# "Access Forbidden" 503, so this workflow normally needs a runner with a
# residential IP: a self-hosted runner at home, with the repo variable
# CRAWL_RUNNER set to its label.
#
# The whole core dataset is one request (prices_by_city.jsp returns every city's
# salary and the four rents in a single table), so even a slow link is fine.
# The optional per-city pass adds the "single person living costs" figure.

on:
  schedule:
    # daily; only actually runs when CRAWL_RUNNER is set (see the job condition)
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      page_budget:
        description: "City pages to fetch for living-cost data (0 = skip)"
        default: "0"
      max_age_days:
        description: "Refetch a city page if older than this many days"
        default: "30"

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

env:
  CONCURRENCY: 1
  MIN_GAP_MS: 1500

jobs:
  crawl:
    # a scheduled run is pointless on a hosted runner (numbeo blocks it), so it
    # only fires once a residential runner has been registered
    if: github.event_name != 'schedule' || vars.CRAWL_RUNNER != ''
    runs-on: ${{ vars.CRAWL_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe
        run: node scraper/probe.mjs || true

      - name: Country and city list
        run: |
          if [ ! -f data/lists.json ] || [ -n "$(find data/lists.json -mtime +30 2>/dev/null)" ]; then
            node scraper/crawl-lists.mjs
          else
            echo "list is fresh, reusing it"
          fi

      - name: Prices by city (one request)
        run: node scraper/crawl-bulk.mjs

      - name: Index table (one request)
        run: node scraper/crawl-indices.mjs

      - name: Optional per-city pages
        if: inputs.page_budget != '0'
        run: node scraper/crawl-cities.mjs --budget=${{ inputs.page_budget }} --max-age-days=${{ inputs.max_age_days || 30 }}

      - name: Merge
        run: |
          node scraper/merge.mjs
          node -e "
            const d = require('./data/cities.json');
            if (!d.withData) { console.log('::error::nothing scraped - see the probe step'); process.exit(1); }
          "

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "data: crawl $(date -u +%Y-%m-%d)"
          git push
