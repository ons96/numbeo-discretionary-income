name: Probe numbeo

# Manual check: does this runner's IP get through to numbeo.com, and how fast?
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Where are we
        run: curl -s https://api.ipify.org && echo && curl -s https://ipinfo.io/org
      - name: numbeo probe
        run: node scraper/probe.mjs
      - name: Raw status codes
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          echo "--- no cookies"
          curl -sS -o /dev/null -w "%{http_code} %{time_total}s\n" -A "$UA" --max-time 30 "https://www.numbeo.com/cost-of-living/in/Toronto"
          echo "--- land on the homepage first, keep the session cookies, then try again"
          rm -f /tmp/jar
          curl -sS -c /tmp/jar -o /dev/null -A "$UA" --max-time 30 "https://www.numbeo.com/cost-of-living/"
          grep -c . /tmp/jar || true
          curl -sS -b /tmp/jar -c /tmp/jar -o /tmp/page.html -w "%{http_code} %{size_download}\n" -A "$UA" \
            -H "Referer: https://www.numbeo.com/cost-of-living/" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: en-US,en;q=0.9" \
            --max-time 30 "https://www.numbeo.com/cost-of-living/in/Toronto?displayCurrency=USD"
          grep -o "<title>[^<]*" /tmp/page.html | head -1
          echo "--- 3 sequential requests, 2s apart, same jar"
          for i in 1 2 3; do
            curl -sS -b /tmp/jar -o /dev/null -w "%{http_code} " -A "$UA" --max-time 30 "https://www.numbeo.com/cost-of-living/in/Toronto?displayCurrency=USD"
            sleep 2
          done
          echo
