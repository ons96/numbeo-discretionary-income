name: Publish

# Builds the site from whatever is committed in data/ and deploys it to Pages.
# Deploys by pushing dist/ to the gh-pages branch instead of using the pages
# artifact API: deploy-pages@v4 intermittently reported "0 artifacts" right
# after a successful upload, failing the deploy. A branch push is deterministic.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "site/**"
      - "scraper/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: |
          node scraper/build.mjs
          echo "--- sanity"
          node -e "const d=require('./site/data.json'); console.log(d.count, 'cities,', Object.keys(d.fx).length, 'currencies'); if (!d.count) process.exit(1)"

      - name: Check minimum-wage provenance
        # Last line of defence before deploy: the crawl job guards cities.json,
        # this guards the payload the page actually loads. A wage that came from
        # an ILO aggregate, or a Swiss city with no statutory rate behind it,
        # must never reach the live site.
        run: node scraper/check-minwage.mjs
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
