name: Scrape and publish

# Daily incremental crawl: refreshes the cities that have gone stale, then
# rebuilds the site and deploys it to GitHub Pages. Public repo, so the
# runner minutes are free.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Cities to fetch per shard this run"
        default: "400"
      max_age_days:
        description: "Refetch a city if its data is older than this many days"
        default: "7"
      refresh_lists:
        description: "Re-crawl the full country/city list first"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

env:
  SHARDS: 4
  CONCURRENCY: 1

jobs:
  lists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Country and city list
        run: |
          if [ "${{ inputs.refresh_lists }}" = "true" ] || [ ! -f data/lists.json ] || [ -n "$(find data/lists.json -mtime +30 2>/dev/null)" ]; then
            echo "refreshing the country/city list"
            node scraper/crawl-lists.mjs
          else
            echo "list is fresh, reusing it"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lists
          path: |
            data/lists.json
            data/indices.json
          if-no-files-found: error

  crawl:
    needs: lists
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: lists
          path: data
      - name: Fetch city pages
        run: |
          node scraper/crawl-cities.mjs \
            --shard=${{ matrix.shard }} \
            --shards=${{ env.SHARDS }} \
            --budget=${{ inputs.budget || 400 }} \
            --max-age-days=${{ inputs.max_age_days || 7 }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: data/shard-${{ matrix.shard }}.json
          if-no-files-found: warn

  publish:
    needs: [lists, crawl]
    if: always() && needs.lists.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: data
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: lists
          path: data
      - name: Merge, compute, build
        run: |
          node scraper/merge.mjs
          node scraper/build.mjs
      - name: Commit the data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lists.json data/indices.json data/cities.json site/data.json site/data.csv
          git diff --quiet --cached || git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
